name: j2k-eval

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluator:
    runs-on: ubuntu-latest
    env:
      J2K_INDEX_TIMEOUT_MS: '180000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test evaluator
        run: ./gradlew test
      - name: Build static J2K runner
        run: ./gradlew :runner:compileKotlin :runner:verifyPluginProjectConfiguration
      - name: Run static J2K on edge-case corpus
        run: xvfb-run -a bash scripts/run-static-j2k.sh edge-cases/java build/edge-static-j2k-live
      - name: Evaluate live edge-case conversion
        run: ./gradlew run --args="--java edge-cases/java --kotlin build/edge-static-j2k-live --report reports/EDGE_CASE_LIVE_J2K.md --jsonl reports/edge-case-live-j2k.jsonl"
      - name: Run edge-case evaluation
        run: bash scripts/run-edge-eval.sh
      - name: Fetch real-world benchmark source
        run: bash scripts/fetch-benchmark.sh
      - name: Run static J2K on Apache Commons CSV
        run: xvfb-run -a bash scripts/run-static-j2k.sh work/commons-csv/src/main/java build/commons-csv-j2k
      - name: Evaluate Apache Commons CSV conversion
        run: ./gradlew run --args="--java work/commons-csv/src/main/java --kotlin build/commons-csv-j2k --report reports/COMMONS_CSV.md --jsonl reports/commons-csv.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: j2k-eval-reports
          path: reports/
