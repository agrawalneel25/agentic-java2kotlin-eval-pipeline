name: j2k-eval

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test evaluator
        run: ./gradlew test
      - name: Run edge-case evaluation
        run: bash scripts/run-edge-eval.sh
      - name: Fetch real-world benchmark source
        run: bash scripts/fetch-benchmark.sh
      - name: Run static J2K hook when configured
        env:
          J2K_RUNNER_CMD: ${{ vars.J2K_RUNNER_CMD }}
        run: |
          if [ -z "$J2K_RUNNER_CMD" ]; then
            echo "J2K_RUNNER_CMD is not configured, skipping real-world conversion step"
            exit 0
          fi
          bash scripts/run-static-j2k.sh work/commons-csv/src/main/java build/commons-csv-j2k
          ./gradlew run --args="--java work/commons-csv/src/main/java --kotlin build/commons-csv-j2k --report reports/COMMONS_CSV.md --jsonl reports/commons-csv.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: j2k-eval-reports
          path: reports/
