name: j2k-eval

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test evaluator
        run: ./gradlew test
      - name: Build static J2K runner
        run: ./gradlew :runner:compileKotlin :runner:verifyPluginProjectConfiguration
      - name: Run edge-case evaluation
        run: bash scripts/run-edge-eval.sh
      - name: Fetch real-world benchmark source
        run: bash scripts/fetch-benchmark.sh
      - name: Evaluate committed live J2K edge output
        run: ./gradlew run --args="--java edge-cases/java --kotlin fixtures/edge-static-j2k --report reports/EDGE_CASE_LIVE_J2K.md --jsonl reports/edge-case-live-j2k.jsonl"
      - name: Check real-world benchmark scan report
        run: test -s reports/COMMONS_CSV.md && test -s reports/commons-csv.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: j2k-eval-reports
          path: reports/
